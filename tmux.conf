# ─────────────────────────────────────────────────────────────────────────────
# Prefix
# ─────────────────────────────────────────────────────────────────────────────
unbind C-b
set-option -g prefix C-Space
bind-key C-Space send-prefix


# ─────────────────────────────────────────────────────────────────────────────
# Sane defaults
# ─────────────────────────────────────────────────────────────────────────────
set -g base-index 1
setw -g pane-base-index 1
setw -g automatic-rename on
set -g renumber-windows on
set -g history-limit 50000
set -sg escape-time 0           # no delay on ESC (vim/nvim)
set -g focus-events on          # forward focus events to apps
set -g mouse on                 # scroll, click, resize panes
set -g set-clipboard on         # OSC 52 — works over SSH too
setw -g mode-keys vi

# True color + italics
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,iTerm.app:RGB"


# ─────────────────────────────────────────────────────────────────────────────
# Reload
# ─────────────────────────────────────────────────────────────────────────────
bind r source-file "$HOME/.config/tmux/tmux.conf" \; display-message "tmux config reloaded 🎊"


# ─────────────────────────────────────────────────────────────────────────────
# Splits — keep current path
# ─────────────────────────────────────────────────────────────────────────────
bind V split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"


# ─────────────────────────────────────────────────────────────────────────────
# Sessions / windows / panes
# ─────────────────────────────────────────────────────────────────────────────
bind x kill-pane
bind C-c new-session
bind t choose-tree

bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

bind -r h select-pane -L
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind > swap-pane -D
bind < swap-pane -U

bind -r H resize-pane -L 2
bind -r J resize-pane -D 2
bind -r K resize-pane -U 2
bind -r L resize-pane -R 2


# ─────────────────────────────────────────────────────────────────────────────
# Copy mode — vi keys, yank to system pasteboard
# ─────────────────────────────────────────────────────────────────────────────
bind Enter copy-mode
bind -T copy-mode-vi v     send -X begin-selection
bind -T copy-mode-vi V     send -X select-line
bind -T copy-mode-vi C-v   send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel 'pbcopy'
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel 'pbcopy'


# ─────────────────────────────────────────────────────────────────────────────
# UI — status bar uses bg=default so it follows the terminal's light/dark mode.
# Accent colors are mid-tone Solarized hues that read on either background.
# ─────────────────────────────────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=default,fg=colour244"

# Left: session name (reverses while prefix is held → live feedback)
set -g status-left-length 40
set -g status-left "#[fg=colour33,bold]#{?client_prefix,#[reverse],} #S #[default] "

# Right: date + clock
set -g status-right-length 60
set -g status-right "#[fg=colour244]%a %d %b  #[fg=colour33,bold]%H:%M "

# Window list
setw -g window-status-format         " #I  #W "
setw -g window-status-current-format "#[fg=colour33,bold,reverse] #I  #W #[default]"
setw -g window-status-separator      ""
setw -g window-status-activity-style "fg=colour172,bold"

# Pane borders — subtle inactive, accented active
set -g pane-border-style        "fg=colour240"
set -g pane-active-border-style "fg=colour33"

# Messages (e.g. the "config reloaded" toast)
set -g message-style         "fg=colour33,bg=default,bold"
set -g message-command-style "fg=colour33,bg=default,bold"

# Mode (copy-mode/selection) — readable on both bgs
set -g mode-style "fg=colour33,reverse"
